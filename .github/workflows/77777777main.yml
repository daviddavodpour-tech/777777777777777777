name: HOPE APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "17"
  NDK_VERSION: "28.2.13676358"
  API_BASE_URL: "http://10.0.2.2:3000/api/v1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project root
        shell: bash
        run: |
          set -euo pipefail

          echo "Working directory:"
          pwd

          echo
          echo "Checking Flutter project..."

          test -f pubspec.yaml || {
            echo "::error::pubspec.yaml not found in repository root."
            exit 1
          }

          test -d lib || {
            echo "::error::lib directory not found."
            exit 1
          }

          test -d android || {
            echo "::error::android directory not found."
            exit 1
          }

          echo "Flutter project root is valid."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle.kts ]; then
            FILE="android/app/build.gradle.kts"

            if grep -q "ndkVersion" "$FILE"; then
              sed -i \
                "s/ndkVersion[[:space:]]*=.*/ndkVersion = \"${NDK_VERSION}\"/" \
                "$FILE"
            else
              sed -i \
                "/android {/a\\    ndkVersion = \"${NDK_VERSION}\"" \
                "$FILE"
            fi

          elif [ -f android/app/build.gradle ]; then
            FILE="android/app/build.gradle"

            if grep -q "ndkVersion" "$FILE"; then
              sed -i \
                "s/ndkVersion[[:space:]].*/ndkVersion \"${NDK_VERSION}\"/" \
                "$FILE"
            else
              sed -i \
                "/android {/a\\    ndkVersion \"${NDK_VERSION}\"" \
                "$FILE"
            fi

          else
            echo "::error::No Android Gradle file found."
            exit 1
          fi

          echo "Configured NDK:"
          grep "ndkVersion" "$FILE"

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test --coverage

      - name: Build debug APK
        run: |
          flutter build apk \
            --debug \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          test -f "$APK"

          echo "Debug APK:"
          ls -lh "$APK"

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "Release APK:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Generate SHA256
        shell: bash
        run: |
          sha256sum \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            | tee apk-sha256.txt

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: HOPE-apk-sha256
          path: apk-sha256.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: "build-${{ github.run_number }}"
          name: "HOPE Build ${{ github.run_number }}"
          artifacts: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
            apk-sha256.txt
          body: |
            # HOPE APK

            Debug APK:
            app-debug.apk

            Release APK:
            app-release.apk

      - name: Final summary
        shell: bash
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "# ✅ HOPE APK BUILD SUCCESSFUL"
            echo
            echo "[📥 Download APK artifacts](${RUN_URL}#artifacts)"
            echo
            echo "Release asset: \`app-release.apk\`"
            echo "Debug asset: \`app-debug.apk\`"
          } >> "$GITHUB_STEP_SUMMARY
